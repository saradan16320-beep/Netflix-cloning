<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#141414"/>
  <!-- Distinctive Netflix Red N -->
  <g transform="translate(136, 86)">
    <!-- Left vertical bar -->
    <path d="M0,0 L68,0 L68,340 L0,340 Z" fill="#B81D24"/>
    <!-- Right vertical bar -->
    <path d="M172,0 L240,0 L240,340 L172,340 Z" fill="#B81D24"/>
    <!-- Diagonal bar with shadow/depth -->
    <path d="M0,0 L78,0 L240,340 L162,340 Z" fill="#E50914" filter="drop-shadow(-4px 0px 8px rgba(0,0,0,0.6))"/>
  </g>
  <!-- Offline download badge indicator -->
  <circle cx="410" cy="410" r="60" fill="#E50914" stroke="#141414" stroke-width="12"/>
  <path d="M410,380 L410,430 M390,412 L410,432 L430,412 M385,445 L435,445" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
